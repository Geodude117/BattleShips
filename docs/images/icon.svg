<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2342"/>
      <stop offset="1" stop-color="#123E6B"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5E96"/>
      <stop offset="1" stop-color="#0E3A63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FA9F5" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#3FA9F5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3FA9F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Sea with two wave bands -->
  <path d="M0 760 C 120 720, 240 720, 360 760 S 600 800, 720 760 S 940 720, 1024 750 V1024 H0 Z" fill="url(#sea)"/>
  <path d="M0 850 C 130 815, 250 815, 380 850 S 620 885, 750 850 S 950 815, 1024 840 V1024 H0 Z" fill="#0B3157" opacity="0.9"/>

  <!-- Glow behind the target -->
  <circle cx="590" cy="500" r="330" fill="url(#glow)"/>

  <!-- Target ring -->
  <circle cx="590" cy="500" r="235" fill="none" stroke="#FFFFFF" stroke-width="36"/>

  <!-- The plus sign doubles as the crosshair -->
  <rect x="555" y="330" width="70" height="340" rx="35" fill="#FF8A1F"/>
  <rect x="420" y="465" width="340" height="70" rx="35" fill="#FF8A1F"/>

  <!-- Ring ticks at the four compass points -->
  <rect x="578" y="228" width="24" height="62" rx="12" fill="#FFFFFF"/>
  <rect x="578" y="710" width="24" height="62" rx="12" fill="#FFFFFF"/>
  <rect x="318" y="488" width="62" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="800" y="488" width="62" height="24" rx="12" fill="#FFFFFF"/>

  <!-- Salvo: three shells arcing in from the left, with dotted trails -->
  <g stroke="#FFD166" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M95 360 Q 140 205 238 170" stroke-width="11" stroke-dasharray="2 27"/>
    <path d="M80 500 Q 130 330 240 288" stroke-width="11" stroke-dasharray="2 27"/>
    <path d="M100 640 Q 150 460 252 410" stroke-width="11" stroke-dasharray="2 27"/>
  </g>
  <circle cx="262" cy="164" r="30" fill="#FFD166"/>
  <circle cx="268" cy="280" r="34" fill="#FFD166"/>
  <circle cx="280" cy="400" r="38" fill="#FFD166"/>
</svg>
